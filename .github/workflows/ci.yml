name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veil
          POSTGRES_PASSWORD: veil
          POSTGRES_DB: veil_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veil -d veil_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:api
        env:
          VEIL_TEST_DATABASE_URL: postgresql://veil:veil@127.0.0.1:5432/veil_smoke
      - run: pnpm build
